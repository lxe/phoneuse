# Phone Use as a Flatpak. Build from the repository root:
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/co.lxe.PhoneUse.yml
# docs/PACKAGING.md explains what the sandbox holds and why each permission is here.
app-id: co.lxe.PhoneUse
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: phoneuse-app
finish-args:
  - --share=network            # AirPlay from the iPhone, the bridge over Wi-Fi, the companion API
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio        # the phone's mirrored sound; the spoken Siri request for the pointer
  - --device=all               # the GPU, and the bridge's USB serial port for flashing it
  - --system-talk-name=org.freedesktop.Avahi        # advertise the AirPlay receiver and the companion API
  - --system-talk-name=org.bluez                    # set up a bridge over BLE; this PC's Bluetooth (HID profiles)
  - --allow=bluetooth                               # this PC's Bluetooth: L2CAP sockets to the iPhone
  - --system-talk-name=org.fedoraproject.FirewallD1 # "Allow on this network" (asks for the password)
  - --talk-name=org.freedesktop.Flatpak             # the same for ufw (pkexec on the host)
  - --filesystem=~/.claude:create                   # connect Claude Code: the skill
  - --filesystem=~/.claude.json
  - --filesystem=~/.local/bin:create                # the `phoneuse` command for agents
  - --env=PYTHONPATH=/app/lib/phoneuse
modules:
  - name: libplist
    buildsystem: autotools
    config-opts: [--without-cython, --disable-static]
    sources:
      - type: git
        url: https://github.com/libimobiledevice/libplist.git
        tag: 2.7.0
        commit: e1531342fe084781124d2243ccad8d8eca5c9db5
    cleanup: [/bin, /include, /lib/pkgconfig, '*.la']

  # Only Avahi's dns_sd compatibility library, which UxPlay uses to advertise itself;
  # the runtime's libavahi-client talks to the host's avahi-daemon over the system bus.
  - name: avahi-compat
    buildsystem: autotools
    config-opts:
      - --with-distro=none
      - --disable-static
      - --disable-qt3
      - --disable-qt4
      - --disable-qt5
      - --disable-gtk
      - --disable-gtk3
      - --disable-python
      - --disable-pygobject
      - --disable-mono
      - --disable-monodoc
      - --disable-manpages
      - --disable-xmltoman
      - --disable-gdbm
      - --disable-libdaemon
      - --disable-libevent
      - --disable-core-docs
      - --disable-doxygen-doc
      - --disable-autoipd
      - --disable-tests
      - --enable-compat-libdns_sd
    sources:
      - type: git
        url: https://github.com/avahi/avahi.git
        tag: v0.8
        commit: f060abee2807c943821d88839c013ce15db17b58
    cleanup: [/bin, /sbin, /etc, /share, /include/avahi-*, /lib/pkgconfig/avahi-*, '*.la', /lib/avahi]

  - name: uxplay
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release, -DNO_MARCH_NATIVE=ON]
    sources:
      - type: git
        url: https://github.com/FDH2/UxPlay.git
        tag: v1.73.7
        commit: df67c212a433cf6dda3676dd40c097900d24e645

  # BlueZ for this PC's Bluetooth (hid_daemon.py: profiles, the pairing agent)
  - name: dbus-python
    buildsystem: meson
    config-opts: [-Dtests=disabled, -Ddoc=disabled, -Dpython=python3]
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/f3/cc/23f24bc7cbfec3a0ab508b7e11bc98837d77a91445d5f666a8545353a147/dbus_python-1.5.1.tar.gz
        sha256: 57423cf87d09b7d084f420b55b737fe654c33339b06df77945620d97795c6ac4

  - python-deps.json

  # Flashing the bridge from the app (Bridge › Install Firmware): esptool, and the
  # firmware from the release, which the app writes over USB.
  - python-esptool.json
  - name: bridge-firmware
    buildsystem: simple
    build-commands:
      - install -Dm644 phoneuse-bridge-0.3.1.bin /app/share/phoneuse/firmware/phoneuse-bridge.bin
      - echo 0.3.1 > /app/share/phoneuse/firmware/VERSION
    sources:
      - type: file
        url: https://github.com/lxe/phoneuse/releases/download/bridge-firmware-0.3.1/phoneuse-bridge-0.3.1.bin
        sha256: ae65855c97f3ce260f28610b38e27a966666c13acf5eea423b74cd5a0945a942

  - name: phoneuse
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/phoneuse /app/bin
      - cp -r phoneuse /app/lib/phoneuse/
      - rm -rf /app/lib/phoneuse/phoneuse/__pycache__
      - install -m755 packaging/flatpak/phoneuse.sh /app/bin/phoneuse
      - install -m755 packaging/flatpak/phoneuse-app.sh /app/bin/phoneuse-app
      - mkdir -p /app/share/phoneuse && cp -r skill /app/share/phoneuse/skill
      - install -Dm644 packaging/flatpak/co.lxe.PhoneUse.desktop /app/share/applications/co.lxe.PhoneUse.desktop
      - install -Dm644 packaging/flatpak/co.lxe.PhoneUse.metainfo.xml /app/share/metainfo/co.lxe.PhoneUse.metainfo.xml
      - install -Dm644 packaging/icons/hicolor/64x64/apps/co.lxe.PhoneUse.png /app/share/icons/hicolor/64x64/apps/co.lxe.PhoneUse.png
      - install -Dm644 packaging/icons/hicolor/128x128/apps/co.lxe.PhoneUse.png /app/share/icons/hicolor/128x128/apps/co.lxe.PhoneUse.png
      - install -Dm644 packaging/icons/hicolor/256x256/apps/co.lxe.PhoneUse.png /app/share/icons/hicolor/256x256/apps/co.lxe.PhoneUse.png
      - install -Dm644 packaging/icons/hicolor/512x512/apps/co.lxe.PhoneUse.png /app/share/icons/hicolor/512x512/apps/co.lxe.PhoneUse.png
      - install -Dm644 packaging/icons/hicolor/symbolic/apps/co.lxe.PhoneUse-agent-symbolic.svg /app/share/icons/hicolor/symbolic/apps/co.lxe.PhoneUse-agent-symbolic.svg
      - install -Dm644 packaging/icons/hicolor/symbolic/apps/co.lxe.PhoneUse-mirroring-symbolic.svg /app/share/icons/hicolor/symbolic/apps/co.lxe.PhoneUse-mirroring-symbolic.svg
    sources:
      - type: dir
        path: ../..
        skip: [build-dir, .flatpak-builder, .venv-vision, bridge/build, ios, touchlab]
